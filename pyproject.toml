[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-impact-analyzer"
version = "0.1.0"
description = "Import-graph blast radius and test selection for Python pull requests."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "httpx>=0.27",  # required by FastAPI's TestClient
    "ruff>=0.5",
]

[tool.setuptools]
packages = ["pr_impact_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pr_impact_analyzer --cov-branch --cov-report=term-missing"
markers = [
    "property: Hypothesis property-based tests",
    "slow: tests that take noticeably longer than the rest",
]

[tool.coverage.run]
branch = true
source = ["pr_impact_analyzer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle and pyflakes basics, I: import sorting, B: likely bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]
